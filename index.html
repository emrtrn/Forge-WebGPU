<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge WebGPU</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #16181c;
        overflow: hidden;
      }
      /* The renderer's canvas fills the window; the boot screen sits above it and is empty while the game runs. */
      #viewport {
        position: fixed;
        inset: 0;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: auto;
      }
      #app:empty {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
