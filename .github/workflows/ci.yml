name: CI

# Runs the same gate as the local pre-push ritual: type check (four tsconfigs:
# app, src tests, Node tools, render smoke),
# layer check + its self-test, file size budget, Node load check, asset gate
# (type + licence + source, D16), unit tests, build, the editor's browser
# checks (headless Chrome, preinstalled on the runner).
# There is no GPU here: render acceptance is local, on a real WebGPU backend;
# editor pages that draw run with WebGL forced (never a WebGPU acceptance).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck · layers · tests · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gate
        run: npm run gate
